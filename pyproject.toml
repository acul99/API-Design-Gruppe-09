[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-realtime-analysis"
version = "1.0.0"
description = "Vorlesungsprojekt: Echtzeit-Analyse von IoT-Sensordaten mit RabbitMQ"
requires-python = ">=3.11"
dependencies = ["pika==1.3.2"]

[project.scripts]
iot-analysis = "iot_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
